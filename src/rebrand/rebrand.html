<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RELETHE Hero</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Parkinsans:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --color-electric-blue: #0000F2;
      --color-depth-blue: #0000B8;
      --color-accent-yellow: #FFDD00;
      --color-stark-white: #FFFFFF;
      --color-border-overlay: rgba(255, 255, 255, 0.4);

      --font-display: "Parkinsans", sans-serif;
      --font-body: "Archivo", system-ui, sans-serif;

      --display-size: 80px;
      --display-line-height: 96px;
      --display-tracking: 1px;

      --nav-size: 14px;
      --nav-line-height: 16px;
      --nav-tracking: 2px;

      --pill-radius: 80px;
      --pill-padding-y: 12px;
      --pill-padding-x: 16px;
      --nav-padding-x: 48px;
      --nav-padding-y: 24px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 320vh;
      background: var(--color-electric-blue);
      color: var(--color-stark-white);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    #relethe-hero {
      position: fixed;
      inset: 0;
      min-height: 100vh;
      background: var(--color-electric-blue);
      isolation: isolate;
    }

    #relethe-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      display: block;
      background: var(--color-electric-blue);
    }

    .site-nav {
      position: fixed;
      z-index: 20;
      inset: 0 0 auto 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      padding: var(--nav-padding-y) var(--nav-padding-x);
      pointer-events: none;
    }

    .brand,
    .nav-cluster,
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 28px;
      pointer-events: auto;
    }

    .brand {
      gap: 9px;
      justify-self: start;
      font-family: var(--font-body);
      font-size: 13px;
      line-height: 16px;
      letter-spacing: 4px;
      font-weight: 500;
    }

    .brand-mark {
      width: 19px;
      height: 19px;
      flex: 0 0 19px;
    }

    .nav-cluster { justify-self: center; }

    .nav-actions { justify-self: end; }

    .nav-link,
    .btn-pill {
      font-family: var(--font-body);
      font-size: var(--nav-size);
      line-height: var(--nav-line-height);
      letter-spacing: var(--nav-tracking);
      font-weight: 500;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .nav-link {
      color: var(--color-stark-white);
      text-decoration: none;
    }

    .btn-pill {
      min-height: 40px;
      padding: var(--pill-padding-y) var(--pill-padding-x);
      border-radius: var(--pill-radius);
      border: 1px solid var(--color-stark-white);
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
    }

    .btn-pill:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--color-stark-white);
      color: var(--color-electric-blue);
    }

    .btn-outline {
      background: transparent;
      color: var(--color-stark-white);
    }

    .theme-toggle {
      height: 40px;
      min-width: 76px;
      padding: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 0;
      border-radius: var(--pill-radius);
      background: var(--color-depth-blue);
    }

    .theme-toggle span {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--color-stark-white);
    }

    .theme-toggle span:last-child {
      background: var(--color-electric-blue);
    }

    .hero-content {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      grid-template-rows: minmax(112px, 21vh) auto 1fr auto minmax(42px, 7vh);
      justify-items: center;
      pointer-events: none;
    }

    h1 {
      grid-row: 2;
      margin: 0;
      max-width: min(1100px, calc(100vw - 40px));
      text-align: center;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(48px, 6vw, var(--display-size));
      line-height: 120%;
      letter-spacing: var(--display-tracking);
      color: var(--color-stark-white);
    }

    h1 span {
      display: block;
      color: var(--color-accent-yellow);
    }

    .hero-form-container {
      grid-row: 4;
      width: min(530px, calc(100vw - 40px));
      height: 48px;
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: var(--pill-radius);
      border: 1px solid var(--color-border-overlay);
      background: rgba(0, 0, 242, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    .input-field {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0 20px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--color-stark-white);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 14px;
      letter-spacing: 0;
    }

    .input-field::placeholder {
      color: rgba(255,255,255,0.55);
    }

    .hero-form-container .btn-primary {
      height: 40px;
      min-height: 40px;
      border: 0;
    }

    @media (max-width: 760px) {
      :root {
        --nav-padding-x: 18px;
        --nav-padding-y: 18px;
      }

      .site-nav {
        grid-template-columns: 1fr auto;
      }

      .nav-cluster {
        justify-self: end;
        gap: 12px;
      }

      .nav-link,
      .nav-cluster .btn-primary {
        display: none;
      }

      .nav-actions {
        display: none;
      }

      h1 {
        font-size: clamp(42px, 14vw, 64px);
      }
    }
  </style>
</head>

<body>
  <section id="relethe-hero" aria-label="RELETHE hero">
    <canvas id="relethe-canvas"></canvas>

    <nav class="site-nav">
      <a class="brand" href="#" aria-label="RELETHE home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#FFFFFF" d="M12 1.7c2.1 0 3.8 1.7 3.8 3.8 0 .5-.1 1-.3 1.5.5-.2 1-.3 1.5-.3 2.1 0 3.8 1.7 3.8 3.8s-1.7 3.8-3.8 3.8c-.5 0-1-.1-1.5-.3.2.5.3 1 .3 1.5 0 2.1-1.7 3.8-3.8 3.8s-3.8-1.7-3.8-3.8c0-.5.1-1 .3-1.5-.5.2-1 .3-1.5.3-2.1 0-3.8-1.7-3.8-3.8S4.9 6.7 7 6.7c.5 0 1 .1 1.5.3-.2-.5-.3-1-.3-1.5C8.2 3.4 9.9 1.7 12 1.7Zm0 6.6a3.7 3.7 0 1 0 0 7.4 3.7 3.7 0 0 0 0-7.4Z"/>
        </svg>
        RELETHE
      </a>

      <div class="nav-cluster">
        <a class="nav-link" href="#">Cohort</a>
        <a class="nav-link" href="#">Manifesto</a>
        <button class="theme-toggle" type="button" aria-label="Toggle solar/lunar theme">
          <span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="3.4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <span>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20.5 14.4A8.2 8.2 0 0 1 9.6 3.5 8.8 8.8 0 1 0 20.5 14.4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
        <button class="btn-pill btn-primary" type="button">Join Now</button>
      </div>

      <div class="nav-actions">
        <button class="btn-pill btn-outline" type="button">Sign In</button>
      </div>
    </nav>

    <main class="hero-content">
      <h1>
        Imagine Sisyphus
        <span>never alone...</span>
      </h1>

      <form class="hero-form-container">
        <input class="input-field" type="email" placeholder="Email address" aria-label="Email address" />
        <button class="btn-pill btn-primary" type="submit">Join Now</button>
      </form>
    </main>
  </section>

  <script type="module">
    import * as THREE from "https://esm.sh/three@0.165.0";
    import { gsap } from "https://esm.sh/gsap@3.12.5";
    import { ScrollTrigger } from "https://esm.sh/gsap@3.12.5/ScrollTrigger";

    gsap.registerPlugin(ScrollTrigger);

    const HERO = document.getElementById("relethe-hero");
    const CANVAS = document.getElementById("relethe-canvas");

    const vertexShader = `
      varying vec3 vWorld;
      varying vec3 vNormal;
      varying vec2 vUv;

      void main() {
        vUv = uv;
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorld = world.xyz;
        vNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * world;
      }
    `;

    const fragmentShader = `
      precision highp float;

      uniform float uTime;
      uniform float uScroll;
      uniform float uSeed;
      uniform float uKind;
      uniform vec3 uWhite;
      uniform vec3 uBlue;

      varying vec3 vWorld;
      varying vec3 vNormal;
      varying vec2 vUv;

      float hash(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32 + uSeed);
        return fract(p.x * p.y);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i + vec2(0.0,0.0)), hash(i + vec2(1.0,0.0)), u.x),
          mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x),
          u.y
        );
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        mat2 r = mat2(1.62, -1.18, 1.18, 1.62);
        for (int i = 0; i < 5; i++) {
          v += a * noise(p);
          p = r * p + 11.7;
          a *= 0.52;
        }
        return v;
      }

      float bayer4(vec2 p) {
        int x = int(mod(p.x, 4.0));
        int y = int(mod(p.y, 4.0));
        int index = x + y * 4;
        float v = 0.0;
        if (index == 0) v = 0.0; if (index == 1) v = 8.0; if (index == 2) v = 2.0; if (index == 3) v = 10.0;
        if (index == 4) v = 12.0; if (index == 5) v = 4.0; if (index == 6) v = 14.0; if (index == 7) v = 6.0;
        if (index == 8) v = 3.0; if (index == 9) v = 11.0; if (index == 10) v = 1.0; if (index == 11) v = 9.0;
        if (index == 12) v = 15.0; if (index == 13) v = 7.0; if (index == 14) v = 13.0; if (index == 15) v = 5.0;
        return (v + 0.5) / 16.0;
      }

      float topographic(vec3 p, vec3 n) {
        float polar = atan(p.z, p.x);
        float radial = length(p.xz);
        float elevation = p.y * 0.62 + fbm(vec2(polar * 1.4, radial * 0.55 + uScroll * 2.8)) * 0.9;
        float bands = abs(fract(elevation * 9.5 - uScroll * 3.5) - 0.5);
        float lines = smoothstep(0.055, 0.006, bands);

        float facets = smoothstep(0.84, 0.96, abs(sin(polar * 7.0 + fbm(p.xz) * 3.0)));
        float rim = pow(1.0 - max(dot(n, normalize(vec3(0.0, 0.35, 1.0))), 0.0), 2.2);
        return clamp(lines * 0.82 + facets * 0.35 + rim * 0.5, 0.0, 1.0);
      }

      float figureDensity(vec3 p, vec3 n) {
        vec3 light = normalize(vec3(-0.35, 0.72, 0.62));
        float lambert = max(dot(n, light), 0.0);
        float muscle = fbm(p.xy * 8.0 + vec2(uTime * 0.3, 0.0));
        float contour = smoothstep(0.03, 0.0, abs(fract((p.y + muscle * 0.18) * 16.0) - 0.5));
        return clamp(lambert * 0.72 + contour * 0.35 + pow(1.0 - abs(n.z), 3.0) * 0.45, 0.0, 1.0);
      }

      float networkDensity(vec3 p) {
        float r = length(p.xy);
        float a = atan(p.y, p.x);
        float rings = smoothstep(0.025, 0.0, abs(fract(r * 10.0 - uTime * 0.03) - 0.5));
        float spokes = smoothstep(0.018, 0.0, abs(fract(a * 4.0 / 6.28318) - 0.5));
        float guilloche = smoothstep(0.02, 0.0, abs(sin(42.0 * r + 9.0 * sin(a * 3.0))));
        return clamp(rings * 0.55 + spokes * 0.28 + guilloche * 0.22, 0.0, 1.0);
      }

      void main() {
        float base = uKind < 0.5 ? topographic(vWorld, normalize(vNormal)) :
                     uKind < 1.5 ? figureDensity(vWorld, normalize(vNormal)) :
                     networkDensity(vWorld);

        vec2 cell = floor(gl_FragCoord.xy / 2.0);
        vec2 local = fract(gl_FragCoord.xy / 2.0) - 0.5;
        float dotShape = smoothstep(0.42, 0.12, length(local));
        float threshold = bayer4(cell) * 0.86 + hash(cell + uSeed) * 0.14;
        float ink = step(threshold, base) * dotShape;

        if (ink < 0.08) discard;
        gl_FragColor = vec4(uWhite, ink);
      }
    `;

    function createReletheHero() {
      const renderer = new THREE.WebGLRenderer({
        canvas: CANVAS,
        antialias: false,
        alpha: false,
        powerPreference: "high-performance"
      });

      renderer.setClearColor("#0000F2", 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#0000F2");

      const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 80);
      camera.position.set(0, 0.5, 10.6);

      const sharedUniforms = {
        uTime: { value: 0 },
        uScroll: { value: 0 },
        uSeed: { value: 37.113 },
        uWhite: { value: new THREE.Color("#FFFFFF") },
        uBlue: { value: new THREE.Color("#0000F2") }
      };

      const makeMaterial = kind => new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms: {
          ...sharedUniforms,
          uKind: { value: kind }
        },
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      const domeMaterial = makeMaterial(0);
      const figureMaterial = makeMaterial(1);
      const networkMaterial = makeMaterial(2);

      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(4.65, 192, 96, 0, Math.PI * 2, 0, Math.PI * 0.58),
        domeMaterial
      );
      dome.rotation.x = Math.PI;
      dome.scale.set(1.52, 1.03, 0.42);
      dome.position.set(0, -0.28, -0.7);
      scene.add(dome);

      const ground = new THREE.Mesh(
        new THREE.RingGeometry(1.2, 8.8, 220, 32),
        domeMaterial
      );
      ground.rotation.x = -Math.PI * 0.52;
      ground.position.set(0, -2.1, -0.25);
      ground.scale.set(1.25, 0.42, 1);
      scene.add(ground);

      const networks = [];
      for (let i = 0; i < 3; i++) {
        const net = new THREE.Mesh(
          new THREE.RingGeometry(1.1 + i * 0.08, 2.65 + i * 0.16, 180, 10),
          networkMaterial
        );
        net.position.set(i === 0 ? 0 : i === 1 ? -3.75 : 3.75, 1.45 + (i ? -0.25 : 0.28), -1.35);
        net.scale.set(i === 0 ? 1.35 : 0.84, i === 0 ? 1.35 : 0.84, 1);
        scene.add(net);
        networks.push(net);
      }

      function capsule(radius, length, position, rotation = [0, 0, 0]) {
        const mesh = new THREE.Mesh(new THREE.CapsuleGeometry(radius, length, 10, 18), figureMaterial);
        mesh.position.set(...position);
        mesh.rotation.set(...rotation);
        return mesh;
      }

      function makeFigure(x, side) {
        const g = new THREE.Group();
        g.position.set(x, -1.78, 0.86);
        g.scale.setScalar(0.62);

        g.add(capsule(0.24, 0.84, [0, 0.78, 0], [0.12, 0, 0]));
        g.add(capsule(0.3, 0.42, [0, 0.24, 0.02], [0.06, 0, 0]));
        g.add(new THREE.Mesh(new THREE.SphereGeometry(0.18, 24, 16), figureMaterial));
        g.children[g.children.length - 1].position.set(0, 1.39, 0.02);

        g.add(capsule(0.08, 0.74, [-0.36, 1.04, 0.05], [0.2, 0, -0.7]));
        g.add(capsule(0.08, 0.64, [0.36, 1.04, 0.05], [0.2, 0, 0.7]));
        g.add(capsule(0.09, 0.78, [-0.24, -0.35, 0.02], [-0.12, 0, 0.22]));
        g.add(capsule(0.09, 0.78, [0.24, -0.35, 0.02], [-0.12, 0, -0.22]));

        g.userData = { baseX: x, side, phase: Math.abs(x) * 1.7 };
        return g;
      }

      const figures = [
        makeFigure(0, 0),
        makeFigure(-2.0, -1),
        makeFigure(2.0, 1)
      ];

      figures[1].position.x = -5.0;
      figures[1].visible = false;
      figures[2].position.x = 5.0;
      figures[2].visible = false;
      figures.forEach(f => scene.add(f));

      let scrollProgress = 0;
      let dampedScroll = 0;
      let isVisible = true;
      let rafId = 0;
      const clock = new THREE.Clock();

      ScrollTrigger.create({
        start: 0,
        end: () => document.body.scrollHeight - window.innerHeight,
        scrub: true,
        onUpdate: self => { scrollProgress = self.progress; }
      });

      const resize = () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      };

      const resizeObserver = new ResizeObserver(resize);
      resizeObserver.observe(HERO);
      resize();

      const visibilityObserver = new IntersectionObserver(([entry]) => {
        isVisible = entry.isIntersecting;
        if (isVisible && !rafId) render();
      }, { threshold: 0.01 });

      visibilityObserver.observe(HERO);

      function updateFigures(t, p) {
        const leftIn = gsap.utils.clamp(0, 1, (p - 0.30) / 0.30);
        const rightIn = gsap.utils.clamp(0, 1, (p - 0.60) / 0.30);
        const entries = [1, leftIn, rightIn];

        figures.forEach((figure, index) => {
          const k = entries[index];
          figure.visible = k > 0.015;
          const side = figure.userData.side;
          const phase = t * (1.5 + p * 5.0) + figure.userData.phase;
          const stride = Math.sin(phase) * 0.08 * k;
          const strain = Math.sin(phase * 1.7) * 0.045 * k;

          figure.position.x = THREE.MathUtils.lerp(
            side < 0 ? -5.0 : side > 0 ? 5.0 : 0,
            figure.userData.baseX,
            k
          ) + stride * side;

          figure.position.y = -1.78 + Math.abs(Math.sin(phase)) * 0.035;
          figure.rotation.z = side * -0.13 * k + strain;
          figure.rotation.x = -0.18 - p * 0.12;

          figure.traverse(child => {
            if (!child.isMesh) return;
            child.rotation.y += Math.sin(phase + child.id) * 0.0015 * k;
          });
        });
      }

      function render() {
        rafId = 0;
        if (!isVisible) return;

        const t = clock.getElapsedTime();
        dampedScroll += (scrollProgress - dampedScroll) * 0.075;

        sharedUniforms.uTime.value = t;
        sharedUniforms.uScroll.value = dampedScroll;

        dome.rotation.z = dampedScroll * -0.42;
        dome.position.y = -0.28 + dampedScroll * 0.36;
        dome.scale.x = 1.52 - dampedScroll * 0.08;
        dome.scale.y = 1.03 + dampedScroll * 0.05;

        ground.rotation.z = dampedScroll * 0.25;

        networks.forEach((net, i) => {
          net.rotation.z = t * (0.025 + i * 0.01) + dampedScroll * (0.35 - i * 0.1);
          net.material.uniforms.uScroll.value = dampedScroll;
        });

        camera.position.x = Math.sin(dampedScroll * Math.PI) * 0.32;
        camera.position.y = 0.5 + dampedScroll * 0.42;
        camera.position.z = 10.6 - dampedScroll * 1.05;
        camera.rotation.z = (dampedScroll - 0.5) * 0.025;
        camera.lookAt(0, -0.12 + dampedScroll * 0.22, -0.35);

        updateFigures(t, dampedScroll);
        renderer.render(scene, camera);
        rafId = requestAnimationFrame(render);
      }

      render();

      return function dispose() {
        cancelAnimationFrame(rafId);
        resizeObserver.disconnect();
        visibilityObserver.disconnect();
        ScrollTrigger.getAll().forEach(trigger => trigger.kill());

        scene.traverse(object => {
          if (!object.isMesh) return;
          object.geometry?.dispose();
          if (Array.isArray(object.material)) object.material.forEach(m => m.dispose());
          else object.material?.dispose();
        });

        renderer.dispose();
      };
    }

    const disposeHero = createReletheHero();
    window.addEventListener("beforeunload", disposeHero, { once: true });
  </script>
</body>
</html>
