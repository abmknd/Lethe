name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Backend tests
        run: node --test "mvp/tests/**/*.test.mjs"

      - name: Build
        run: npm run build

  functions-typecheck:
    name: functions-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Typecheck the Supabase Edge Functions. This is the only automated check
      # that exercises the edge repository / API TypeScript (which cannot run in
      # the node test suite) and catches import or column-list mistakes in the
      # edge layer before they reach a deploy. Follows imports transitively, so
      # _shared/* and the imported mvp/* modules are resolved too.
      # --node-modules-dir=auto lets Deno auto-install npm: specifiers
      # (e.g. npm:postgres in the edge repository) so type resolution succeeds.
      - name: deno check edge functions
        run: |
          deno check --node-modules-dir=auto \
            supabase/functions/api/index.ts \
            supabase/functions/run-weekly-matching/index.ts \
            supabase/functions/signup/index.ts
